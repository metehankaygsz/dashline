name: Release

# Publishes a signed APK whenever a version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Requires four repository secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64    - base64 of your .jks  (base64 -i release.jks | pbcopy)
#   KEYSTORE_PASSWORD  - keystore password
#   KEY_ALIAS          - key alias
#   KEY_PASSWORD       - key password
#
# Without them the job fails fast rather than publishing an unsigned APK.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify signing secrets are present
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. Add the signing secrets before tagging a release."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # v1.2.3 -> versionName 1.2.3, versionCode 10203. Monotonic across releases,
      # which Google Play requires for every upload.
      - name: Derive version from tag
        run: |
          NAME="${GITHUB_REF_NAME#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$NAME"
          MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "APP_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "versionName=$NAME  versionCode=$CODE"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      # legacy APK (KitKat-capable) for sideloading, play AAB for the Play Console.
      - name: Build signed APK and App Bundle
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleLegacyRelease bundlePlayRelease --no-daemon --stacktrace \
            -PappVersionName="$APP_VERSION_NAME" \
            -PappVersionCode="$APP_VERSION_CODE"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/legacy/release/*.apk \
             "dist/dashline-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/bundle/playRelease/*.aab \
             "dist/dashline-${GITHUB_REF_NAME}.aab"

      # The .aab is uploaded to Play, not installed by users, so it stays a build
      # artifact rather than going on the public release page.
      - name: Upload App Bundle for Play Console
        uses: actions/upload-artifact@v4
        with:
          name: play-bundle-${{ github.ref_name }}
          path: dist/*.aab
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Install on a head unit with:

                adb install -r dashline-${{ github.ref_name }}.apk

            Then press Home and choose this launcher.
