name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The Gradle wrapper jar isn't committed yet, so Gradle is installed here.
      # Once gradlew + gradle-wrapper.jar are in the repo, drop gradle-version
      # and call ./gradlew instead.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      # Catches broken R8 / ProGuard rules here rather than at release time.
      # Unsigned is fine — this only needs to prove the build succeeds.
      - name: Build release APK (unsigned, verifies R8)
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Lint
        run: gradle lintDebug --no-daemon

      # assembleDebug/assembleRelease build every flavour, so both the KitKat
      # (legacy) and Play (minSdk 21) variants are verified on each push.
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
